<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Moka Italiana | Coffee Brew Lab</title>

    <link rel="stylesheet" href="app.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

    <header class="topbar">

        <a href="index.html">
            ← Inicio
        </a>

        <h1>🇮🇹 Moka Italiana</h1>

    </header>

    <!-- KPI -->

    <section class="kpis">

        <div class="kpi">
            <h2 id="kpiPreparaciones">0</h2>
            <p>Preparaciones</p>
        </div>

        <div class="kpi">
            <h2 id="kpiTiempo">0:00</h2>
            <p>Tiempo Medio</p>
        </div>

        <div class="kpi">
            <h2 id="kpiCorrectas">0%</h2>
            <p>Correctas</p>
        </div>

        <div class="kpi">
            <h2 id="kpiCafe">0g</h2>
            <p>Café Medio</p>
        </div>

    </section>

    <!-- RECETA -->

    <section class="card">

        <h2>Receta</h2>

        <select id="cafeSeleccionado">

            <option value="">
                Seleccionar Café
            </option>

        </select>

        <input type="number" id="cafe" value="18" placeholder="Café (g)">

        <input type="number" id="agua" value="180" placeholder="Agua (ml)">

        <select id="fuego">

            <option>Gas</option>
            <option>Inducción</option>
            <option>Vitrocerámica</option>

        </select>

        <select id="molienda">

            <option>Fina</option>
            <option selected>Media</option>
            <option>Media-Gruesa</option>

        </select>

    </section>

    <!-- CRONOMETRO -->

    <section class="card">

        <h2>Cronómetro</h2>

        <div id="estadoExtraccion">

            Preparado para comenzar

        </div>

        <div id="cronometro" class="cronometro">

            00:00

        </div>

        <div class="progress">

            <div id="progressBar" class="progress-bar">
            </div>

        </div>

        <button onclick="iniciarMoka()">
            ▶ Iniciar
        </button>

        <br><br>

        <button onclick="detenerMoka()">
            ■ Detener
        </button>

    </section>

    <!-- EVALUACION -->

    <section class="card">

        <h2>Diagnóstico</h2>

        <div id="evaluacion" style="
font-size:22px;
font-weight:bold;
text-align:center;">

            Esperando extracción

        </div>

    </section>

    <!-- NOTAS -->

    <section class="card">

        <h2>Notas</h2>

        <textarea id="notas" placeholder="Observaciones de la preparación...">
</textarea>

    </section>

    <!-- GUARDAR -->

    <section class="card">

        <button onclick="guardarPreparacion()">

            Guardar Preparación

        </button>

    </section>

    <!-- GRÁFICO -->

    <section class="card">

        <h2>📈 Consistencia</h2>

        <canvas id="graficoMoka"></canvas>

    </section>

    <!-- HISTORIAL -->

    <section class="card">

        <h2>📋 Historial</h2>

        <div id="historial"></div>

    </section>

    <script>

        const preparaciones =
            JSON.parse(
                localStorage.getItem(
                    "mokaPreparaciones"
                )
            ) || [];

        let inicio;
        let intervalo;
        let chart;

        if (
            typeof cargarSelectCafes === "function"
        ) {

            cargarSelectCafes(
                "cafeSeleccionado"
            );

        }

        function iniciarMoka() {

            clearInterval(intervalo);

            inicio = Date.now();

            intervalo = setInterval(() => {

                const segundos =

                    Math.floor(
                        (Date.now() - inicio) / 1000
                    );

                actualizarTiempo(
                    segundos
                );

            }, 1000);

        }

        function detenerMoka() {

            clearInterval(
                intervalo
            );

            evaluarExtraccion();

        }

        function actualizarTiempo(segundos) {

            const min =
                Math.floor(
                    segundos / 60
                );

            const seg =
                segundos % 60;

            document
                .getElementById(
                    "cronometro"
                )
                .innerText =

                String(min)
                    .padStart(2, "0")

                + ":"

                +

                String(seg)
                    .padStart(2, "0");

            const progreso =

                Math.min(

                    (segundos / 360) * 100,

                    100

                );

            document
                .getElementById(
                    "progressBar"
                )
                .style.width =

                progreso + "%";

            if (segundos < 240) {

                document
                    .getElementById(
                        "estadoExtraccion"
                    )
                    .innerHTML =

                    "🔥 Calentando";

            }

            else if (segundos <= 360) {

                document
                    .getElementById(
                        "estadoExtraccion"
                    )
                    .innerHTML =

                    "☕ Extrayendo";

            }

            else {

                document
                    .getElementById(
                        "estadoExtraccion"
                    )
                    .innerHTML =

                    "⚠️ Tiempo excedido";

            }

        }

        function evaluarExtraccion() {

            const tiempoTexto =
                document
                    .getElementById(
                        "cronometro"
                    )
                    .innerText;

            const partes =
                tiempoTexto.split(":");

            const totalSegundos =

                Number(partes[0]) * 60 +

                Number(partes[1]);

            let resultado = "";

            if (totalSegundos < 240) {

                resultado =
                    "⚠️ Extracción corta";

            }

            else if (
                totalSegundos >= 240 &&
                totalSegundos <= 360
            ) {

                resultado =
                    "✅ Correcta";

            }

            else {

                resultado =
                    "🔥 Sobrecalentada";

            }

            document
                .getElementById(
                    "evaluacion"
                )
                .innerHTML =
                resultado;

        }

        function guardarPreparacion() {

            const registro = {

                id: Date.now(),

                fecha:
                    new Date()
                        .toLocaleString(),

                cafe:
                    document
                        .getElementById(
                            "cafeSeleccionado"
                        ).value,

                gramos:
                    document
                        .getElementById(
                            "cafe"
                        ).value,

                agua:
                    document
                        .getElementById(
                            "agua"
                        ).value,

                fuego:
                    document
                        .getElementById(
                            "fuego"
                        ).value,

                molienda:
                    document
                        .getElementById(
                            "molienda"
                        ).value,

                tiempo:
                    document
                        .getElementById(
                            "cronometro"
                        ).innerText,

                resultado:
                    document
                        .getElementById(
                            "evaluacion"
                        ).innerText,

                notas:
                    document
                        .getElementById(
                            "notas"
                        ).value

            };

            preparaciones.push(
                registro
            );

            localStorage.setItem(

                "mokaPreparaciones",

                JSON.stringify(
                    preparaciones
                )

            );

            renderHistorial();
            actualizarKPIs();
            actualizarGrafico();

            alert(
                "✅ Preparación guardada"
            );

        }

        function renderHistorial() {

            document
                .getElementById(
                    "historial"
                )
                .innerHTML =

                [...preparaciones]

                    .reverse()

                    .map(p => `

    <div class="registro">

        <h3>
        🇮🇹 ${p.cafe || "Sin Café"}
        </h3>

        <p>⚖️ ${p.gramos} g</p>

        <p>💧 ${p.agua} ml</p>

        <p>🔥 ${p.fuego}</p>

        <p>⚙️ ${p.molienda}</p>

        <p>⏱️ ${p.tiempo}</p>

        <p>${p.resultado}</p>

        <p>📝 ${p.notas || "-"}</p>

        <small>${p.fecha}</small>

    </div>

    `).join("");

        }

        function actualizarKPIs() {

            document
                .getElementById(
                    "kpiPreparaciones"
                )
                .innerText =
                preparaciones.length;

            if (
                preparaciones.length === 0
            ) return;

            let cafe = 0;
            let segundos = 0;
            let correctas = 0;

            preparaciones.forEach(p => {

                cafe +=
                    Number(p.gramos);

                const t =
                    p.tiempo.split(":");

                segundos +=

                    Number(t[0]) * 60 +

                    Number(t[1]);

                if (
                    p.resultado.includes(
                        "Correcta"
                    )
                ) {

                    correctas++;

                }

            });

            document
                .getElementById(
                    "kpiCafe"
                )
                .innerText =

                (
                    cafe /
                    preparaciones.length
                ).toFixed(1)
                + "g";

            const promedio =

                Math.round(
                    segundos /
                    preparaciones.length
                );

            document
                .getElementById(
                    "kpiTiempo"
                )
                .innerText =

                Math.floor(
                    promedio / 60
                )

                + ":"

                +

                String(
                    promedio % 60
                ).padStart(2, "0");

            document
                .getElementById(
                    "kpiCorrectas"
                )
                .innerText =

                Math.round(

                    correctas * 100 /

                    preparaciones.length

                ) + "%";

        }

        function actualizarGrafico() {

            const datos =
                preparaciones.map(p => {

                    const t =
                        p.tiempo.split(":");

                    return (

                        Number(t[0]) * 60 +

                        Number(t[1])

                    );

                });

            if (chart) {

                chart.destroy();

            }

            chart = new Chart(

                document
                    .getElementById(
                        "graficoMoka"
                    ),

                {

                    type: "line",

                    data: {

                        labels:
                            datos.map(
                                (_, i) => "#" + (i + 1)
                            ),

                        datasets: [{

                            label:
                                "Tiempo de extracción",

                            data: datos,

                            borderColor: "#c58b45",

                            fill: false,

                            tension: .3

                        }]

                    }

                });

        }

        renderHistorial();
        actualizarKPIs();
        actualizarGrafico();

    </script>

</body>

</html>
